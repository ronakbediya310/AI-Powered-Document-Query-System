<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Login</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Segoe UI', sans-serif;
      background: skyblue;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .container {
      display: flex;
      width: 900px;
      height: 550px;
      border-radius: 20px;
      overflow: hidden;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.1);
      background-color: white;
    }

    .left-panel {
      flex: 1;
      background: linear-gradient(135deg, #007bff, #3ca9c1);
      color: white;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      padding: 2rem;
    }

    .left-panel h1 {
      font-size: 2.5rem;
      margin-bottom: 1rem;
    }

    .left-panel p {
      font-size: 1.1rem;
      text-align: center;
      max-width: 300px;
    }

    .right-panel {
      flex: 1;
      background-color: white;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 2rem;
    }

    .login-form {
      width: 100%;
      max-width: 350px;
    }

    .login-form h2 {
      margin-bottom: 1.5rem;
      font-size: 2rem;
      color: #333;
      text-align: center;
    }

    .login-form input[type="text"],
    .login-form input[type="password"] {
      width: 100%;
      padding: 12px;
      margin-bottom: 1rem;
      border: 1px solid #ccc;
      border-radius: 8px;
      font-size: 1rem;
    }

    .login-form button {
      width: 100%;
      padding: 12px;
      background: linear-gradient(to right, #2193b0, #6dd5ed);
      color: white;
      border: none;
      border-radius: 8px;
      font-size: 1rem;
      font-weight: bold;
      cursor: pointer;
      transition: 0.3s ease;
    }

    .login-form button:hover {
      background: linear-gradient(to right, #1e81a7, #57c1e8);
    }

    .error {
      color: red;
      text-align: center;
      margin-top: 10px;
    }

    @media (max-width: 768px) {
      .container {
        flex-direction: column;
        width: 90%;
        height: auto;
      }

      .left-panel {
        border-radius: 20px 20px 0 0;
      }

      .right-panel {
        border-radius: 0 0 20px 20px;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="left-panel">
      <h1>Welcome back!</h1>
      <p>You can sign in to access with your existing account.</p>
    </div>
    <div class="right-panel">
      <form class="login-form" method="POST">
        {% csrf_token %}
        <h2>Sign In</h2>
        <input type="text" name="username" placeholder="Username" required />
        <input type="password" name="password" placeholder="Password" required />
        <button type="submit">Sign In</button>
        {% if error %}
          <div class="error">{{ error }}</div>
        {% endif %}
      </form>
    </div>
  </div>
</body>
</html>
